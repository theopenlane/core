version: '3'

tasks:
  install:
    desc: install dependencies
    cmds:
      - npm install jsonschema2mk --global

  generate:
    desc: generate the jsonschema and documentation
    deps:
      - task: schema-and-docs
      - task: workflow-schema-and-docs
      - task: integration-schema
      - task: openapi

  schema-and-docs:
    internal: true
    cmds:
      - task: schema
      - task: docs

  workflow-schema-and-docs:
    internal: true
    cmds:
      - task: workflow-schema
      - task: workflow-docs

  schema:
    desc: generate a new jsonschema and corresponding config/config.example.yaml
    env:
      GOFLAGS: "{{.GO_INLINE_FLAG}}"
    cmds:
      - go run jsonschema/schema_generator.go

  workflow-schema:
    desc: generate the workflow definition jsonschema
    env:
      GOFLAGS: "{{.GO_INLINE_FLAG}}"
    cmds:
      - go run jsonschema/workflow_schema_generator.go

  integration-schema:
    desc: snapshot the installation-facing surface of every integration definition
    env:
      GOFLAGS: "{{.GO_INLINE_FLAG}}"
    cmds:
      - go run jsonschema/integration_schema_generator.go

  docs:
    desc: generate documentation from the jsonschema
    cmds:
      - npx jsonschema2mk --schema jsonschema/core.config.json > jsonschema/api-docs.md

  workflow-docs:
    desc: generate documentation from the workflow jsonschema
    cmds:
      - npx jsonschema2mk --schema jsonschema/workflow.definition.json > jsonschema/workflow-docs.md

  openapi:
    desc: generate the OpenAPI specification and its spec types from the registered routes
    env:
      GOFLAGS: "{{.GO_INLINE_FLAG}}"
    cmds:
      - go generate internal/httpserve/specs/generate/generate.go

  ci:
    desc: a task that runs during CI to confirm there are no changes after running generate
    cmds:
      - task: generate
      - task: :check:clean
