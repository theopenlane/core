env:
  APP_NAME: ${APP_NAME:-core}
  IMAGE_REPO: ghcr.io/theopenlane/${APP_NAME}
  IMAGE_TAG: ${BUILDKITE_BUILD_NUMBER}-${BUILDKITE_COMMIT:0:8}
  SONAR_HOST: https://sonarcloud.io

  # graphql settings
  GRAPHQL_SCHEMA_LOCATION: "internal/graphapi/clientschema/schema.graphql"
  GRAPHQL_HISTORY_SCHEMA_LOCATION: "internal/graphapi/historyschema/schema.graphql"
  GRAPHQL_SCHEMA_NAME: "Openlane-0dedz@current"
  GRAPHQL_HISTORY_SCHEMA_NAME: "Openlane-History@current"

  # build settings, default to what is in buildkite
  BK_HOME: ${BK_HOME:-/var/lib/buildkite-agent}
  CACHE_HOME: ${CACHE_HOME:-$BK_HOME/.cache}
  GOCACHE: ${GOCACHE:-$CACHE_HOME/go-build}
  GOMODCACHE: ${GOMODCACHE:-$CACHE_HOME/go/pkg/mod}
  GOLANGCI_LINT_CACHE: ${GOLANGCI_LINT_CACHE:-$CACHE_HOME/golangci-lint}
  GIT_MIRRORS_PATH: ${GIT_MIRRORS_PATH:-$BK_HOME/git-mirrors}
  CONFIG_HOME: ${CONFIG_HOME:-/tmp}
  GIT_CONFIG_GLOBAL: ${GIT_CONFIG_GLOBAL:-$CONFIG_HOME/.gitconfig}
  APOLLO_CONFIG_HOME: ${APOLLO_CONFIG_HOME:-$CONFIG_HOME}
  SONAR_USER_HOME: ${SONAR_USER_HOME:-$CONFIG_HOME/.sonar}
  SCANNER_WORKDIR_PATH: ${SCANNER_WORKDIR_PATH:-$CONFIG_HOME/sonar-scanner-work}

  # helm settings
  HELM_CHART_REPO: https://github.com/theopenlane/openlane-infra.git
  HELM_CHART_PATH: charts/openlane

  # test settings
  TEST_DB_URL: "docker://postgres:18-alpine"

  # runner vars
  LARGE_RUNNER_QUEUE: ${LARGE_RUNNER_QUEUE:-self-hosted-garage-vms}
  SMALL_RUNNER_QUEUE: ${SMALL_RUNNER_QUEUE:-self-hosted-garage-vms}
  GARAGE_RUNNER_QUEUE: ${GARAGE_RUNNER_QUEUE:-self-hosted-garage-vms}
  RUNNER_WORKLOAD_LIGHTWEIGHT: "lightweight"
  RUNNER_WORKLOAD_STANDARD: "standard"
  LARGE_RUNNER_SHAPE: ${LARGE_RUNNER_SHAPE:-}
  MEDIUM_RUNNER_SHAPE: ${MEDIUM_RUNNER_SHAPE:-}
  SMALL_RUNNER_SHAPE: ${SMALL_RUNNER_SHAPE:-}
  XSMALL_RUNNER_SHAPE: ${XSMALL_RUNNER_SHAPE:-}
  NSC_ARM_ARCH: ${NSC_ARM_ARCH:-}
  # concurrency limits for the medium and small steps, unlimited unless the pipeline sets them
  LARGE_CONCURRENCY_GROUP: ${LARGE_CONCURRENCY_GROUP:-core/unlimited-large}
  LARGE_CONCURRENCY: ${LARGE_CONCURRENCY:-100}
  MEDIUM_CONCURRENCY_GROUP: ${MEDIUM_CONCURRENCY_GROUP:-core/unlimited-medium}
  MEDIUM_CONCURRENCY: ${MEDIUM_CONCURRENCY:-100}
  SMALL_CONCURRENCY_GROUP: ${SMALL_CONCURRENCY_GROUP:-core/unlimited-small}
  SMALL_CONCURRENCY: ${SMALL_CONCURRENCY:-100}
  NSC_CACHE_TAG_BUILD: ${NSC_CACHE_TAG_BUILD:-}
  NSC_CACHE_TAG_LINT: ${NSC_CACHE_TAG_LINT:-}
  NSC_CACHE_TAG_TEST: ${NSC_CACHE_TAG_TEST:-}
  NSC_CACHE_TAG_TEST_GRAPH: ${NSC_CACHE_TAG_TEST_GRAPH:-}
  NSC_CACHE_TAG_LIGHT: ${NSC_CACHE_TAG_LIGHT:-}
  NSC_CACHE_SIZE: ${NSC_CACHE_SIZE:-}
  NSC_CACHE_SIZE_LIGHT: ${NSC_CACHE_SIZE_LIGHT:-}
  NSC_CACHE_PATH: ${NSC_CACHE_PATH:-}
  NSC_GIT_MIRROR: ${NSC_GIT_MIRROR:-}
  NSC_CONTAINERD_CACHE_RELATIVE_PATH: ${NSC_CONTAINERD_CACHE_RELATIVE_PATH:-}

secrets:
  - GITHUB_TOKEN
  - SLACK_WEBHOOK_URL
  - ANALYTICS_KEY
  - SONAR_TOKEN
  - APOLLO_KEY
  - SECRET_GHCR_PUBLISH_TOKEN

priority: ${OPENLANE_BUILDKITE_JOB_PRIORITY:-0}

# shared blocks referenced by alias from the steps below, ignored by buildkite itself
common:
  # runner disk could not be freed below the retry threshold in pre-command
  disk-full-retry: &disk-full-retry
    automatic:
      - exit_status: 75
        limit: 2

  # namespace instance settings, empty unless set by the pipeline
  nsc-tags: &nsc-tags
    nsc-cache-path: $NSC_CACHE_PATH
    nsc-git-mirror: $NSC_GIT_MIRROR
    nsc-containerd-cache-relative-path: $NSC_CONTAINERD_CACHE_RELATIVE_PATH
  # each runner group has its own cache tag so jobs do not overwrite each other's cache
  large-lint-runner: &large-lint-runner
    !!merge <<: *nsc-tags
    queue: $LARGE_RUNNER_QUEUE
    workload: $RUNNER_WORKLOAD_STANDARD
    nsc-shape: $LARGE_RUNNER_SHAPE
    nsc-arch: $NSC_ARM_ARCH
    nsc-cache-tag: $NSC_CACHE_TAG_LINT
    nsc-cache-size: $NSC_CACHE_SIZE
  large-test-runner: &large-test-runner
    !!merge <<: *nsc-tags
    queue: $LARGE_RUNNER_QUEUE
    workload: $RUNNER_WORKLOAD_STANDARD
    nsc-shape: $LARGE_RUNNER_SHAPE
    nsc-arch: $NSC_ARM_ARCH
    nsc-cache-tag: $NSC_CACHE_TAG_TEST_GRAPH
    nsc-cache-size: $NSC_CACHE_SIZE
  medium-test-runner: &medium-test-runner
    !!merge <<: *nsc-tags
    queue: $LARGE_RUNNER_QUEUE
    workload: $RUNNER_WORKLOAD_STANDARD
    nsc-shape: $MEDIUM_RUNNER_SHAPE
    nsc-arch: $NSC_ARM_ARCH
    nsc-cache-tag: $NSC_CACHE_TAG_TEST
    nsc-cache-size: $NSC_CACHE_SIZE
  small-test-runner: &small-test-runner
    !!merge <<: *nsc-tags
    queue: $SMALL_RUNNER_QUEUE
    workload: $RUNNER_WORKLOAD_LIGHTWEIGHT
    nsc-shape: $SMALL_RUNNER_SHAPE
    nsc-arch: $NSC_ARM_ARCH
    nsc-cache-tag: $NSC_CACHE_TAG_TEST
    nsc-cache-size: $NSC_CACHE_SIZE
  medium-runner: &medium-runner
    !!merge <<: *nsc-tags
    queue: $LARGE_RUNNER_QUEUE
    workload: $RUNNER_WORKLOAD_STANDARD
    nsc-shape: $MEDIUM_RUNNER_SHAPE
    nsc-cache-tag: $NSC_CACHE_TAG_BUILD
    nsc-cache-size: $NSC_CACHE_SIZE
  small-runner: &small-runner
    !!merge <<: *nsc-tags
    queue: $SMALL_RUNNER_QUEUE
    workload: $RUNNER_WORKLOAD_LIGHTWEIGHT
    nsc-shape: $SMALL_RUNNER_SHAPE
    nsc-cache-tag: $NSC_CACHE_TAG_BUILD
    nsc-cache-size: $NSC_CACHE_SIZE
  # shell scripts and single cli calls, only the image cache
  xsmall-runner: &xsmall-runner
    !!merge <<: *nsc-tags
    queue: $SMALL_RUNNER_QUEUE
    workload: $RUNNER_WORKLOAD_LIGHTWEIGHT
    nsc-shape: $XSMALL_RUNNER_SHAPE
    nsc-cache-tag: $NSC_CACHE_TAG_LIGHT
    nsc-cache-size: $NSC_CACHE_SIZE_LIGHT
  # merged into steps so they queue in buildkite, not in the namespace instance limit
  large-concurrency: &large-concurrency
    concurrency_group: $LARGE_CONCURRENCY_GROUP
    concurrency: $LARGE_CONCURRENCY
  medium-concurrency: &medium-concurrency
    concurrency_group: $MEDIUM_CONCURRENCY_GROUP
    concurrency: $MEDIUM_CONCURRENCY
  small-concurrency: &small-concurrency
    concurrency_group: $SMALL_CONCURRENCY_GROUP
    concurrency: $SMALL_CONCURRENCY
  # docker image builds stay on garage, they rely on agent v4 post-command hook order
  garage-runner: &garage-runner
    queue: $GARAGE_RUNNER_QUEUE
    workload: $RUNNER_WORKLOAD_STANDARD

  # docker plugin options for the build image, merged into a step with <<: *build-image
  build-image: &build-image
    image: "ghcr.io/theopenlane/build-image:latest"
    always-pull: true
    propagate-environment: true
    propagate-uid-gid: true
  # multi-arch images for lint and tests, task comes from the go.mod tool block
  go-image: &go-image
    image: "golang:1.27.3-alpine"
    always-pull: true
    propagate-environment: true
    propagate-uid-gid: true
  golangci-lint-image: &golangci-lint-image
    image: "golangci/golangci-lint:v2.13.2-alpine"
    always-pull: true
    propagate-environment: true
    propagate-uid-gid: true
  cli-build: &cli-build
    !!merge <<: *build-image
    volumes: &go-lint-volumes
      - $GOCACHE:$GOCACHE
      - $GOMODCACHE:$GOMODCACHE
      - $GOLANGCI_LINT_CACHE:$GOLANGCI_LINT_CACHE
    environment:
      - GOOS=darwin
      - GOARCH=arm64
    command: ["task", "go:build-cli:ci"]
  sonar-scanner: &sonar-scanner
    image: "sonarsource/sonar-scanner-cli:12.3"
    propagate-environment: true
    propagate-uid-gid: true
    volumes:
      - $GOCACHE:$GOCACHE
      - $GOMODCACHE:$GOMODCACHE
      - $GOLANGCI_LINT_CACHE:$GOLANGCI_LINT_CACHE
      # scanner needs the git mirror at the same path for SCM blame
      - $GIT_MIRRORS_PATH:$GIT_MIRRORS_PATH:ro
    command: [".buildkite/sonar-scan.sh"]

  go-cache-volumes: &go-cache-volumes
    - $GOCACHE:$GOCACHE
    - $GOMODCACHE:$GOMODCACHE
  go-test-volumes: &go-test-volumes
    - $GOCACHE:$GOCACHE
    - $GOMODCACHE:$GOMODCACHE
    - $GOLANGCI_LINT_CACHE:$GOLANGCI_LINT_CACHE
    - "/var/run/docker.sock:/var/run/docker.sock"

  go-env: &go-env
    - "CGO_ENABLED=0"
    - "GOTOOLCHAIN=auto"
  go-test-env: &go-test-env
    - "ANALYTICS_KEY"
    - "TEST_DB_URL"
    - "TEST_DB_CONTAINER_EXPIRY=20" # container expiry in minutes
    - "TEST_DB_HOST=172.17.0.1" # docker host ip on linux
    - "CGO_ENABLED=0"
  go-test-parallel-env: &go-test-parallel-env
    - "ANALYTICS_KEY"
    - "TEST_DB_URL"
    - "TEST_DB_CONTAINER_EXPIRY=20" # container expiry in minutes
    - "TEST_DB_HOST=172.17.0.1" # docker host ip on linux
    - "CGO_ENABLED=0"
    - "BUILDKITE_PARALLEL_JOB"
    - "BUILDKITE_PARALLEL_JOB_COUNT"
  automation-env: &automation-env
    - "GITHUB_TOKEN"
    - "HELM_CHART_REPO"
    - "HELM_CHART_PATH"
    - "SLACK_WEBHOOK_URL"
    - "BUILDKITE_BUILD_CHECKOUT_PATH=/workdir"

  # step conditions used by more than one step
  if-release-tag: &if-release-tag build.tag != null && build.tag !~ /cli\// && build.tag !~ /common\//
  if-any-tag: &if-any-tag build.tag != null
  if-not-module-tag: &if-not-module-tag build.tag == null || (build.tag !~ /cli\// && build.tag !~ /common\//)
  if-not-cli-tag: &if-not-cli-tag build.tag == null || build.tag !~ /cli\//
  if-pull-request: &if-pull-request build.pull_request.id != null
  if-main: &if-main build.branch == "main"
  if-main-untagged: &if-main-untagged build.branch == "main" && build.tag == null

steps:
  - label: ":renovate: go work sync"
    retry: *disk-full-retry
    key: "renovate_go_work_sync"
    !!merge <<: *small-concurrency
    if: build.branch =~ /^renovate\//
    agents: *small-runner
    if_changed:
      - go.{mod,sum}
      - cli/go.{mod,sum}
      - common/go.{mod,sum}
      - tools/linters/privacyallow/go.{mod,sum}
    plugins:
      - docker#v5.14.0:
          !!merge <<: *build-image
          command: ["bash", ".buildkite/renovate-go-work-sync.sh"]
          volumes: *go-cache-volumes
          environment:
            - "GITHUB_TOKEN"
            - "CGO_ENABLED=0"
            - "GOTOOLCHAIN=auto"
            - "BUILDKITE_BUILD_CHECKOUT_PATH=/workdir"
  # a pushed sync commit supersedes this build, so nothing else should start
  - wait: ~
    if: build.branch =~ /^renovate\//
  - group: ":golangci-lint: Linter"
    key: "linter"
    steps:
      - label: ":golangci-lint: lint :lint-roller:"
        retry: *disk-full-retry
        if_changed:
          - "**.go"
          - .golangci.yaml
          - .custom-gcl.yml
          - go.{mod,sum}
        agents: *large-lint-runner
        cancel_on_build_failing: true
        timeout_in_minutes: 30
        key: "lint"
        !!merge <<: *large-concurrency
        if: *if-not-module-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_TOP:-4}
        plugins:
          - docker#v5.14.0:
              !!merge <<: *golangci-lint-image
              command: ["go", "tool", "task", "go:lint:ci"]
              volumes: *go-lint-volumes
              environment: *go-env
  - group: ":knife: validation" # validate genenrate was clean
    key: "validate_generate"
    steps:
      - label: ":golang: go generate"
        retry: *disk-full-retry
        key: "generate"
        !!merge <<: *medium-concurrency
        if: *if-not-cli-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_HIGH:-3}
        agents: *medium-runner
        cancel_on_build_failing: true
        if_changed:
          - go.{mod,sum}
          - internal/ent/**
          - internal/graphapi/**
          - common/enums/**
          - fga/generate/**
        plugins:
          - docker#v5.14.0:
              !!merge <<: *build-image
              command: ["task", "generate:core:ci"]
              volumes: *go-cache-volumes
              environment: *go-env
      - label: ":golang: go generate - catalog + onboarding"
        retry: *disk-full-retry
        key: "generate_other"
        !!merge <<: *small-concurrency
        if: *if-not-cli-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_LOW:-1}
        agents: *small-runner
        cancel_on_build_failing: true
        if_changed:
          - go.{mod,sum}
          - pkg/catalog/**
          - common/models/**
          - internal/onboarding/**
        plugins:
          - docker#v5.14.0:
              !!merge <<: *build-image
              command: ["task", "generate:other:ci"]
              volumes: *go-cache-volumes
              environment: *go-env
      - label: ":auth0: fga generate"
        retry: *disk-full-retry
        key: "generate_fga"
        !!merge <<: *small-concurrency
        if: *if-not-module-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_LOW:-1}
        agents: *small-runner
        cancel_on_build_failing: true
        if_changed:
          - fga/**
          - internal/ent/schema/**
          - internal/ent/mixin/**
        plugins:
          - docker#v5.14.0:
              !!merge <<: *build-image
              command: ["task", "fga:ci"]
              volumes: *go-cache-volumes
              environment: *go-env
      - label: ":yaml: generate config"
        retry: *disk-full-retry
        key: "generate_config"
        !!merge <<: *medium-concurrency
        if: *if-not-cli-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_HIGH:-3}
        agents: *medium-runner
        cancel_on_build_failing: true
        if_changed:
          - go.{mod,sum}
          - internal/**
          - pkg/**
          - config/**
          - common/**
          - jsonschema/**
        plugins:
          - docker#v5.14.0:
              !!merge <<: *build-image
              command: ["task", "config:ci"]
              volumes: *go-cache-volumes
              environment: *go-env
      - label: ":construction: create draft config PR"
        retry: *disk-full-retry
        key: "draft_pr_automation"
        agents: *xsmall-runner
        depends_on: "generate_config"
        if: *if-pull-request
        if_changed:
          - config/configmap-config-file.yaml
          - config/helm-values.yaml
        plugins:
          - docker#v5.14.0:
              !!merge <<: *build-image
              command: ["bash", ".buildkite/draft-pr-automation.sh"]
              volumes: *go-cache-volumes
              environment:
                - "GITHUB_TOKEN"
                - "HELM_CHART_REPO"
                - "HELM_CHART_PATH"
                - "SLACK_WEBHOOK_URL"
                - "BUILDKITE_BUILD_CHECKOUT_PATH=/workdir"
                - "GIT_CONFIG_GLOBAL"
      - label: ":link: link PRs"
        retry: *disk-full-retry
        key: "link_pr_automation"
        agents: *xsmall-runner
        depends_on: "draft_pr_automation"
        if: *if-pull-request
        if_changed:
          - config/configmap-config-file.yaml
          - config/helm-values.yaml
        plugins:
          - sparse-checkout#v1.11.0:
              paths:
                - .buildkite
          - docker#v5.14.0:
              !!merge <<: *build-image
              command: ["bash", ".buildkite/link-pr-automation.sh"]
              volumes: *go-cache-volumes
              environment:
                - "GITHUB_TOKEN"
                - "SLACK_WEBHOOK_URL"
                - "BUILDKITE_BUILD_CHECKOUT_PATH=/workdir"
      - label: ":helm: update helm chart"
        retry: *disk-full-retry
        key: "helm_automation"
        agents: *xsmall-runner
        depends_on: "generate_config"
        if: *if-main
        plugins:
          - sparse-checkout#v1.11.0:
              paths:
                - .buildkite
                - config
          - docker#v5.14.0:
              !!merge <<: *build-image
              command: ["bash", ".buildkite/helm-automation.sh"]
              volumes: *go-cache-volumes
              environment: *automation-env
      - label: ":arrows_counterclockwise: close draft config PRs"
        retry: *disk-full-retry
        key: "post_merge_automation"
        agents: *xsmall-runner
        depends_on: "helm_automation"
        if: *if-main
        plugins:
          - sparse-checkout#v1.11.0:
              paths:
                - .buildkite
          - docker#v5.14.0:
              !!merge <<: *build-image
              command: ["bash", ".buildkite/post-merge-pr-automation.sh"]
              volumes: *go-cache-volumes
              environment: *automation-env
      - label: ":broom: cleanup draft PRs"
        retry: *disk-full-retry
        key: "cleanup_draft_prs"
        agents: *xsmall-runner
        depends_on: "post_merge_automation"
        if: *if-main
        plugins:
          - docker#v5.14.0:
              !!merge <<: *build-image
              command: ["bash", ".buildkite/cleanup-draft-prs.sh"]
              environment:
                - "GITHUB_TOKEN"
                - "HELM_CHART_REPO"
  - group: ":test_tube: Tests"
    key: "go_tests"
    steps:
      - label: ":golang: go test - graphapi only %n/%t"
        retry: *disk-full-retry
        agents: *large-test-runner
        key: "go_test_graph"
        !!merge <<: *large-concurrency
        if: *if-not-module-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_HIGH:-3}
        parallelism: 2
        cancel_on_build_failing: true
        if_changed:
          include:
            - "**.go"
            - go.{mod,sum}
          exclude: # do not run tests if only cli files changed
            - cli/**
        plugins:
          - docker#v5.14.0:
              !!merge <<: *go-image
              command: ["go", "tool", "task", "go:testsum:ci:graph"]
              volumes: *go-test-volumes
              environment: *go-test-parallel-env
        artifact_paths: ["coverage-graph-*.out", "junit-graph-*.xml"]
      - label: ":golang: go test - events only"
        retry: *disk-full-retry
        !!merge <<: *medium-concurrency
        agents: *medium-test-runner
        key: "go_test_events"
        if: *if-not-module-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_MEDIUM:-2}
        cancel_on_build_failing: true
        if_changed: # only run when event driven code changes
          # the suite itself and the harness it shares with the graphapi suite
          - internal/graphapi/eventstest/**
          - internal/graphapi/testharness/**
          # the event runtime the listeners and reconcile loops run on
          - pkg/gala/**
          # every ent listener and the hooks that emit the events they consume
          - internal/ent/hooks/**
          - internal/ent/taskrules/**
          # the integrations and workflow feature and its test fixtures
          - internal/integrations/**
          - internal/workflows/**
          - internal/testutils/integrations/**
          # graphql resolvers and listener helpers for integrations
          - internal/graphapi/integration*.go
          - internal/graphapi/listener_helpers.go
          - go.{mod,sum}
        plugins:
          - docker#v5.14.0:
              !!merge <<: *go-image
              command: ["go", "tool", "task", "go:testsum:ci:events"]
              volumes: *go-test-volumes
              environment: *go-test-env
        artifact_paths: ["coverage-events.out", "junit-events.xml"]
      - label: ":golang: go test - handlers only"
        retry: *disk-full-retry
        !!merge <<: *medium-concurrency
        agents: *medium-test-runner
        key: "go_test_handlers"
        if: *if-not-module-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_MEDIUM:-2}
        cancel_on_build_failing: true
        if_changed:
          include:
            - "**.go"
            - go.{mod,sum}
          exclude: # do not run tests if only cli files changed
            - cli/**
        plugins:
          - docker#v5.14.0:
              !!merge <<: *go-image
              command: ["go", "tool", "task", "go:testsum:ci:handlers"]
              volumes: *go-test-volumes
              environment: *go-test-parallel-env
        artifact_paths: ["coverage-handlers-*.out", "junit-handlers-*.xml"]
      - label: ":golang: go test - all except api"
        retry: *disk-full-retry
        !!merge <<: *medium-concurrency
        if_changed:
          include:
            - "**.go"
            - go.{mod,sum}
          exclude: # do not run tests if only cli files changed
            - cli/**
        agents: *medium-test-runner
        key: "go_test_no_api"
        if: *if-not-module-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_MEDIUM:-2}
        cancel_on_build_failing: true
        plugins:
          - docker#v5.14.0:
              !!merge <<: *go-image
              command: ["go", "tool", "task", "go:testsum:ci:no-graph"]
              volumes: *go-test-volumes
              environment: *go-test-env
        artifact_paths: ["coverage-no-api.out", "junit-no-api.xml"]
      - label: ":golang: lint + test common"
        retry: *disk-full-retry
        !!merge <<: *small-concurrency
        if_changed:
          - common/**
          - go.{mod,sum}
          - go.work
          - .golangci.yaml
          - .custom-gcl.yml
        agents: *small-test-runner
        key: "go_test_common"
        if: *if-not-cli-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_MEDIUM:-2}
        cancel_on_build_failing: true
        plugins:
          - docker#v5.14.0:
              !!merge <<: *golangci-lint-image
              command: ["go", "tool", "task", "go:lint:ci:common", "go:testsum:ci:common"]
              volumes: *go-test-volumes
              environment: *go-test-env
        artifact_paths: ["coverage-common.out", "junit-common.xml"]
      - label: ":auth0: fga model test"
        retry: *disk-full-retry
        if_changed:
          - "fga/**"
        agents: *xsmall-runner
        key: "fga_test"
        if: *if-not-module-tag
        priority: ${OPENLANE_BUILDKITE_PRIORITY_LOW:-1}
        depends_on: "generate_fga"
        plugins:
          - sparse-checkout#v1.11.0:
              paths:
                - fga
          - docker#v5.14.0:
              image: openfga/cli:v0.5.1
              propagate-environment: true
              propagate-uid-gid: true
              command: ["model", "test", "--tests", "fga/tests/tests.yaml"]
  - group: ":closed_lock_with_key: Security Checks"
    key: "security"
    steps:
      - label: ":buildkite: upload test analytics report"
        retry: *disk-full-retry
        key: "test-analytics"
        if: *if-not-module-tag
        agents: *xsmall-runner
        skip: true # skip for now, we are using a bunch of test executions that aren't entirely useful
        cancel_on_build_failing: false
        if_changed:
          include:
            - "**.go"
            - go.{mod,sum}
          exclude:
            - cli/**
        depends_on: ["go_test_graph", "go_test_no_api", "go_test_handlers", "go_test_events"]
        commands: |
          #!/bin/bash
          graph_junits=()
          for f in junit-graph-*.xml; do graph_junits+=(-F "data=@$$f"); done
          handlers_junits=()
          for f in junit-handlers-*.xml; do handlers_junits+=(-F "data=@$$f"); done
          curl \
            -X POST \
            --fail-with-body \
            -H "Authorization: Token token=\"$$ANALYTICS_KEY\"" \
            -F "data=@junit-no-api.xml" \
            "$${graph_junits[@]}" \
            -F "data=@junit-events.xml" \
            "$${handlers_junits[@]}" \
            -F "format=junit" \
            -F "run_env[CI]=buildkite" \
            -F "run_env[key]=$BUILDKITE_BUILD_ID" \
            -F "run_env[number]=$BUILDKITE_BUILD_NUMBER" \
            -F "run_env[job_id]=$BUILDKITE_JOB_ID" \
            -F "run_env[branch]=$BUILDKITE_BRANCH" \
            -F "run_env[commit_sha]=$BUILDKITE_COMMIT" \
            -F "run_env[message]=$BUILDKITE_MESSAGE" \
            -F "run_env[url]=$BUILDKITE_BUILD_URL" \
            https://analytics-api.buildkite.com/v1/uploads
        plugins:
          - artifacts#v1.11.0:
              download: "junit-graph-*.xml"
              step: "go_test_graph"
          - artifacts#v1.11.0:
              download: "junit-no-api.xml"
              step: "go_test_no_api"
          - artifacts#v1.11.0:
              download: "junit-handlers-*.xml"
              step: "go_test_handlers"
      - label: ":github: upload PR reports"
        retry: *disk-full-retry
        key: "scan-upload-pr"
        !!merge <<: *small-concurrency
        cancel_on_build_failing: true
        agents: *small-runner
        if_changed:
          include:
            - "**.go"
            - go.{mod,sum}
          exclude:
            - cli/**
        if: *if-pull-request
        depends_on: ["go_test_graph", "go_test_no_api", "go_test_handlers", "go_test_events"]
        plugins:
          - artifacts#v1.11.0:
              download: "coverage-handlers-*.out"
              step: "go_test_handlers"
          - artifacts#v1.11.0:
              download: "coverage-no-api.out"
              step: "go_test_no_api"
          - artifacts#v1.11.0:
              download: "coverage-graph-*.out"
              step: "go_test_graph"
          - artifacts#v1.11.0:
              download: "junit-handlers-*.xml"
              step: "go_test_handlers"
          - artifacts#v1.11.0:
              download: "junit-no-api.xml"
              step: "go_test_no_api"
          - artifacts#v1.11.0:
              download: "junit-graph-*.xml"
              step: "go_test_graph"
          - artifacts#v1.11.0:
              download: "coverage-events.out"
              step: "go_test_events"
              ignore_missing: true
          - artifacts#v1.11.0:
              download: "junit-events.xml"
              step: "go_test_events"
              ignore_missing: true

          - docker#v5.14.0:
              !!merge <<: *sonar-scanner
              environment:
                - "SONAR_TOKEN"
                - "SONAR_HOST_URL=$SONAR_HOST"
                - "SONAR_SCANNER_OPTS=-Dsonar.pullrequest.branch=$BUILDKITE_BRANCH -Dsonar.pullrequest.base=$BUILDKITE_PULL_REQUEST_BASE_BRANCH -Dsonar.pullrequest.key=$BUILDKITE_PULL_REQUEST"
      - label: ":github: upload reports"
        retry: *disk-full-retry
        key: "scan-upload"
        !!merge <<: *small-concurrency
        agents: *small-runner
        if_changed:
          include:
            - "**.go"
          exclude:
            - cli/**
        cancel_on_build_failing: true
        if: *if-main-untagged
        depends_on: ["go_test_graph", "go_test_no_api", "go_test_handlers", "go_test_events"]
        plugins:
          - artifacts#v1.11.0:
              download: "coverage-no-api.out"
              step: "go_test_no_api"
          - artifacts#v1.11.0:
              download: "coverage-graph-*.out"
              step: "go_test_graph"
          - artifacts#v1.11.0:
              download: "coverage-handlers-*.out"
              step: "go_test_handlers"
          - artifacts#v1.11.0:
              download: "junit-handlers-*.xml"
              step: "go_test_handlers"
          - artifacts#v1.11.0:
              download: "junit-no-api.xml"
              step: "go_test_no_api"
          - artifacts#v1.11.0:
              download: "junit-graph-*.xml"
              step: "go_test_graph"
          - artifacts#v1.11.0:
              download: "coverage-events.out"
              step: "go_test_events"
              ignore_missing: true
          - artifacts#v1.11.0:
              download: "junit-events.xml"
              step: "go_test_events"
              ignore_missing: true
          - docker#v5.14.0:
              !!merge <<: *sonar-scanner
              environment:
                - "SONAR_TOKEN"
                - "SONAR_HOST_URL=$SONAR_HOST"
  - group: ":golang: Builds"
    key: "go-builds"
    steps:
      - label: ":golang: build"
        retry: *disk-full-retry
        key: "gobuild-server"
        !!merge <<: *medium-concurrency
        depends_on: "generate"
        cancel_on_build_failing: true
        if: build.tag == null
        artifact_paths: "bin/${APP_NAME}"
        if_changed:
          include:
            - "**.go"
            - go.{mod,sum}
            - cmd/**
            - docker/Dockerfile
          exclude:
            - cli/**
        agents: *medium-runner
        plugins:
          - docker#v5.14.0:
              !!merge <<: *build-image
              volumes: *go-lint-volumes
              environment:
                - GOOS=linux
              command: ["task", "go:build:ci"]
      - label: ":terminal: build cli"
        retry: *disk-full-retry
        key: "gobuild-cli"
        !!merge <<: *small-concurrency
        if: build.tag == null
        depends_on: "generate"
        agents: *small-runner
        cancel_on_build_failing: true
        artifact_paths: "bin/openlane-cli"
        if_changed:
          include:
            - go.{mod,sum}
            - cli/**
            - common/**
        plugins:
          - docker#v5.14.0: *cli-build
      - label: ":golang: build release"
        retry: *disk-full-retry
        key: "gobuild-server-release"
        !!merge <<: *medium-concurrency
        if: *if-release-tag
        cancel_on_build_failing: true
        artifact_paths: "bin/${APP_NAME}"
        agents: *medium-runner
        plugins:
          - docker#v5.14.0:
              !!merge <<: *build-image
              volumes: *go-lint-volumes
              environment:
                - GOOS=linux
              command: ["task", "go:build:ci:release"]
      - label: ":terminal: build cli release"
        retry: *disk-full-retry
        if: build.tag != null && build.tag =~ /cli\//
        key: "gobuild-cli-release"
        !!merge <<: *small-concurrency
        agents: *small-runner
        cancel_on_build_failing: true
        artifact_paths: "bin/openlane-cli"
        plugins:
          - docker#v5.14.0: *cli-build
  - group: ":database: schema lint"
    key: "database"
    steps:
      - label: ":graphql: lint graphql schema"
        retry: *disk-full-retry
        key: "apollo-lint-schema"
        if: *if-not-module-tag
        if_changed: "**.graphql"
        agents: *xsmall-runner
        skip: "false"
        soft_fail:
          - exit_status: 1
        cancel_on_build_failing: true
        command: |
          #!/bin/sh
          lint_result_file=$$(mktemp)

          # ignore exit code for now
          set +e
          result=$(rover graph check --schema $$GRAPHQL_SCHEMA_LOCATION $$GRAPHQL_SCHEMA_NAME --format plain -o $$lint_result_file 2>&1 > /dev/null)
          set -e

          output=$$(cat $$lint_result_file)

          if [[ "$$output" = "" ]]; then
              echo ""
              echo "Linting Failed:"
              echo "$${result#*error\[E043\]: }"

              echo -e ":graphql: **Graphql Lint Failure**   <br /> $${result#*error\[E043\]: }" |  buildkite-agent annotate --context apollo-lint-schema --style error

              exit 1
          else
              echo ""
              echo "Linting Passed. See annotation for details."

              echo -e ":graphql: **Graphql Lint Results** \n <details><summary> Linter Result </summary><code>$$output</code></details>" |  buildkite-agent annotate --context apollo-lint-schema --style success

              exit 0
          fi
        artifact_paths: linter-result.txt
        plugins:
          - sparse-checkout#v1.11.0:
              paths:
                - internal/graphapi
          - docker#v5.14.0:
              !!merge <<: *build-image
              environment:
                - "APOLLO_KEY"
                - "BUILDKITE_AGENT_ACCESS_TOKEN"
  - group: ":docker: Image Build"
    depends_on: "go-builds"
    key: "image-build"
    steps:
      - label: ":docker: docker pr build"
        retry: *disk-full-retry
        key: "docker-pr-build"
        agents: *garage-runner
        cancel_on_build_failing: true
        if: build.branch != "main" && build.tag == null
        if_changed:
          include:
            - "**.go"
            - docker/Dockerfile
          exclude:
            - cli/**
        commands: |
          #!/bin/bash
          chmod +x ${APP_NAME}
        plugins:
          - artifacts#v1.11.0:
              download:
                - from: "bin/${APP_NAME}"
                  to: "${APP_NAME}"
              step: "gobuild-server"
          - docker-login#v3.1.0: # we need to login for the image to be accessible on the host
              username: openlane-bender
              password-env: SECRET_GHCR_PUBLISH_TOKEN
              server: ghcr.io
          # this needs to be before the container build because post-command hooks are reversed in order
          - equinixmetal-buildkite/trivy#v1.19.0:
              severity: CRITICAL,HIGH
              ignore-unfixed: true
              scanners: misconfig,secret,vuln
              skip-files: "cosign.key,Dockerfile.dev,internal/graphapi/generated/*,internal/ent/generated/*,internal/ent/historygenerated/*"
              trivy-version: "0.74.0"
          - theopenlane/docker-metadata#v1.0.1:
              images:
                - "${IMAGE_REPO}"
              extra_tags:
                - "${IMAGE_TAG}"
          - theopenlane/container-build#v1.1.1:
              dockerfile: docker/Dockerfile
              push: false
              build-args:
                - NAME=${APP_NAME}
      - label: ":docker: docker build and publish"
        retry: *disk-full-retry
        key: "docker-build-and-tag"
        depends_on: "go_tests"
        agents: *garage-runner
        cancel_on_build_failing: true
        if: *if-release-tag
        commands: |
          #!/bin/bash
          chmod +x ${APP_NAME}
        plugins:
          - artifacts#v1.11.0:
              download:
                - from: "bin/${APP_NAME}"
                  to: "${APP_NAME}"
              step: "gobuild-server-release"
          - docker-login#v3.1.0:
              username: openlane-bender
              password-env: SECRET_GHCR_PUBLISH_TOKEN
              server: ghcr.io
          - theopenlane/docker-metadata#v1.0.1:
              images:
                - "${IMAGE_REPO}"
              extra_tags:
                - "${BUILDKITE_TAG}"
                - "latest"
          - theopenlane/container-build#v1.1.1:
              dockerfile: docker/Dockerfile
              push: true
              build-args:
                - NAME=${APP_NAME}
  - group: ":rocket: Publish"
    key: "publish"
    steps:
      - label: ":graphql: publish graphql schema"
        retry: *disk-full-retry
        key: "apollo-publish-schema"
        depends_on: "go_tests"
        agents: *xsmall-runner
        skip: false
        if: *if-release-tag
        cancel_on_build_failing: true
        command: "rover graph publish --schema $$GRAPHQL_SCHEMA_LOCATION $$GRAPHQL_SCHEMA_NAME"
        plugins:
          - sparse-checkout#v1.11.0:
              paths:
                - internal/graphapi
          - docker#v5.14.0:
              !!merge <<: *build-image
              environment:
                - "APOLLO_KEY"
      - label: ":graphql: publish history graphql schema"
        retry: *disk-full-retry
        key: "apollo-publish-history-schema"
        depends_on: "go_tests"
        skip: false
        if: *if-release-tag
        cancel_on_build_failing: true
        command: "rover graph publish --schema $$GRAPHQL_HISTORY_SCHEMA_LOCATION $$GRAPHQL_HISTORY_SCHEMA_NAME"
        agents: *xsmall-runner
        plugins:
          - sparse-checkout#v1.11.0:
              paths:
                - internal/graphapi
          - cluster-secrets#v1.0.0:
              variables:
                APOLLO_KEY: APOLLO_HISTORY_KEY
          - docker#v5.14.0:
              !!merge <<: *build-image
              environment:
                - "APOLLO_KEY"
      - label: ":test_tube: Trigger UI E2E pipeline tests for ${BUILDKITE_TAG}"
        trigger: openlane-ui-e2e
        depends_on: "docker-build-and-tag"
        if: *if-release-tag
        async: true
  # everything above must pass before the release is rolled out
  - wait: ~
    if: *if-release-tag
  - label: ":rocket: update image tag for release"
    retry: *disk-full-retry
    key: "image_tag_automation"
    if: *if-release-tag
    agents: *xsmall-runner
    plugins:
      - docker#v5.14.0:
          !!merge <<: *build-image
          command: ["bash", ".buildkite/image-tag-automation.sh"]
          volumes: *go-cache-volumes
          environment: *automation-env
  - label: ":go: go-client schema update"
    trigger: go-client
    if: *if-release-tag
    soft_fail: true
  - label: ":docusaurus: update docs for release"
    trigger: openlane-docs
    depends_on: "image_tag_automation"
    if: *if-release-tag
    soft_fail: true
