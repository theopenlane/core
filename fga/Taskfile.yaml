version: "3"

vars:
  # defaults to the dev token, to override pass `task <task_name> FGA_API_TOKEN=your_token`
  FGA_API_TOKEN: '{{ .FGA_API_TOKEN | default "QKwHEmWX99RnFh28eSRJ3GWlfb2FQkL7toh1GJpzch1mMkVeMg" }}'
  SYSTEM_OBJECT: "system:openlane_core"
  SYSTEM_ADMIN_RELATION: "system_admin"
  OPENLANE_API_HOST: '{{ default "http://localhost:17608" .OPENLANE_HOST }}'
  FGA: GOWORK=off go run github.com/openfga/cli/cmd/fga@latest

tasks:
  create:
    desc: creates a new fga store with the testdata model
    cmds:
      - fga store create --name "core dev" --model model/fga.mod --api-token={{ .FGA_API_TOKEN }}

  generate:
    desc: generates the organization level crud definitions based on the schema
    dir: ../
    env:
      GOFLAGS: "{{.GO_INLINE_FLAG}}"
    cmds:
      - go run fga/generate/main.go
      - task: generate:version

  ci:
    desc: a task that runs during CI to confirm there are no changes after running generate
    cmds:
      - task: generate
      - task: :check:clean
      - task: test

  generate:version:
    desc: stamps the model with a marker type derived from the hash of every model file
    silent: true
    dir: ../
    cmds:
      - |
        # hash the files listed in fga.mod, minus the marker file itself, so the marker
        # changes whenever the model changes and stays stable when it does not
        # sha256sum on linux, shasum on macos, both print the same digest
        if command -v sha256sum >/dev/null 2>&1; then sum="sha256sum"; else sum="shasum -a 256"; fi
        hash=$(grep -oE '^[[:space:]]+- .+$' fga/model/fga.mod \
          | sed 's|.*- ||' \
          | grep -v '^generated/version.fga$' \
          | sort \
          | sed 's|^|fga/model/|' \
          | xargs cat \
          | $sum \
          | cut -c1-12)
        if [ -z "$hash" ]; then
          echo "failed to hash the fga model files"
          exit 1
        fi
        printf '# Code generated by task fga:generate:version; DO NOT EDIT.\n\nmodule base\n\n# marker type identifying which build of the model is deployed, see fga/modelversion\ntype model_version_%s\n' "$hash" > fga/model/generated/version.fga
        echo "stamped fga model version model_version_$hash"

  validate:
    desc: validates the fga model file
    silent: true
    cmds:
      - |
        result=$({{.FGA}} model validate --file model/fga.mod)
        if [ "$(echo "$result" | jq .is_valid)" != "true" ]; then
          echo "Model validation failed:"
          echo "$result" | jq .error
          exit 1
        fi

  test:
    desc: runs the fga model tests
    cmds:
      - task: validate
      - "{{.FGA}} model test --tests tests.yaml"

  tuple:write:
    desc: writes test tuples to the fga store
    vars:
      TUPLES:
        sh: find tests/tuples -type f -name '*.yaml' -print
      STORE_ID:
        sh: fga store list --api-token={{ .FGA_API_TOKEN }} |jq -r '.stores.[0].id'
    cmds:
      - for: {var: TUPLES, as: TUPLE}
        cmd: |
          fga tuple write --file "{{.TUPLE}}" --api-token="{{.FGA_API_TOKEN}}" --store-id="{{.STORE_ID}}"

  add:admin:
    desc: Add a user to the system:openlane admin group, if no USER_ID is provided, the logged in user will be used
    vars:
      STORE_ID:
        sh: fga store list --api-token={{ .FGA_API_TOKEN }} |jq -r '.stores.[].id'
      LOGGED_IN_USER:
        sh: openlane user get -z json --host {{ .OPENLANE_API_HOST }}  | jq -r '.self.id'
      USER_ID: "{{ .USER_ID | default .LOGGED_IN_USER }}"
    cmds:
      - fga tuple write --store-id={{ .STORE_ID }} user:{{ .USER_ID }} {{ .SYSTEM_ADMIN_RELATION }} {{ .SYSTEM_OBJECT }} --api-token={{ .FGA_API_TOKEN }}
    preconditions:
      - sh: which openlane
        msg: "Openlane CLI is not installed. Please install it using 'brew install theopenlane/tap/openlane'."
