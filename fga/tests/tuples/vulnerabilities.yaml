############################################
# Tuples for testing the FGA implementation
# This file is specific to vulnerabilities
############################################

# blocked user
- user: group:group-blocked#member
  relation: blocked
  object: vulnerability:vulnerability-1

# vulnerability-2 is associated with a program
- user: program:program-1
  relation: parent
  object: vulnerability:vulnerability-2

- user: user:ulid-of-member
  relation: admin
  object: program:program-1

# vulnerability-3 is associated with a scan
- user: scan:scan-1
  relation: parent
  object: vulnerability:vulnerability-3

- user: user:ulid-of-member
  relation: viewer
  object: scan:scan-1

# vulnerability-org-1 is only associated with the organization
- user: organization:openlane
  relation: parent_context
  object: vulnerability:vulnerability-org-1

# org level view only and edit grants for vulnerabilities
- user: user:ulid-vuln-view-only
  relation: can_view_vulnerability
  object: organization:openlane
- user: user:ulid-vuln-edit
  relation: can_edit_vulnerability
  object: organization:openlane
