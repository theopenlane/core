}
mutation DeleteAudience ($deleteAudienceId: ID!) {
	deleteAudience(id: $deleteAudienceId) {
		deletedID
	}
}
mutation DeleteBulkAudience ($ids: [ID!]!) {
	deleteBulkAudience(ids: $ids) {
		deletedIDs
	}
}
query GetAllAudiences ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [AudienceOrder!]) {
	audiences(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				audienceType
				createdAt
				createdBy
				description
				displayID
				filters
				id
				metadata
				name
				ownerID
				tags
				updatedAt
				updatedBy
				updatedByImpersonator
			}
		}
	}
}
query GetAudienceByID ($audienceId: ID!) {
