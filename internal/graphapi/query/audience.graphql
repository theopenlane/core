mutation CreateAudience ($input: CreateAudienceInput!) {
	createAudience(input: $input) {
		audience {
			audienceType
			createdAt
			createdBy
			description
			displayID
			filters
			id
			metadata
			name
			ownerID
			tags
			updatedAt
			updatedBy
			updatedByImpersonator
		}
	}
}
mutation CreateBulkAudience ($input: [CreateAudienceInput!]) {
	createBulkAudience(input: $input) {
		audiences {
			audienceType
			createdAt
			createdBy
			description
			displayID
			filters
			id
			metadata
			name
			ownerID
			tags
			updatedAt
			updatedBy
			updatedByImpersonator
		}
	}
}
mutation CreateBulkCSVAudience ($input: Upload!) {
	createBulkCSVAudience(input: $input) {
		audiences {
			audienceType
			createdAt
			createdBy
			description
			displayID
			filters
			id
			metadata
			name
			ownerID
			tags
			updatedAt
			updatedBy
			updatedByImpersonator
