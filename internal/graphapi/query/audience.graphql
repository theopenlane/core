}
query GetAudiences ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [AudienceOrder!], $where: AudienceWhereInput) {
	audiences(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy, where: $where) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				audienceType
				createdAt
				createdBy
				description
				displayID
				filters
				id
				metadata
				name
				ownerID
				tags
				updatedAt
				updatedBy
				updatedByImpersonator
			}
		}
	}
}
