	}
}
query GetAllOauthGrants ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [OauthGrantOrder!]) {
	oauthGrants(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				accessLevel
				clientID
				clientName
				clientURI
				createdAt
				createdBy
				id
				installedByUserID
				isActive
				kind
				lastUsedAt
				logoURI
				ownerID
				revokedAt
				revokedBy
				revokedReason
				scopes
				tags
				updatedAt
				updatedBy
				updatedByImpersonator
				userID
			}
		}
	}
}
