mutation CreateBulkCSVOauthGrant ($input: Upload!) {
	createBulkCSVOauthGrant(input: $input) {
		oauthGrants {
			accessLevel
			clientID
			clientName
			clientURI
			createdAt
			createdBy
			id
			installedByUserID
			isActive
			kind
			lastUsedAt
			logoURI
			ownerID
			revokedAt
			revokedBy
			revokedReason
			scopes
			tags
			updatedAt
			updatedBy
			updatedByImpersonator
			userID
		}
	}
}
