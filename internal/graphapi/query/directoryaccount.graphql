mutation CreateBulkCSVDirectoryAccount ($input: Upload!) {
	createBulkCSVDirectoryAccount(input: $input) {
		directoryAccounts {
			accountType
			addedAt
			avatarLocalFileID
			avatarRemoteURL
			avatarUpdatedAt
			canonicalEmail
			createdAt
			createdBy
			department
			directoryName
			displayID
			displayName
			emailAliases
			environmentID
			environmentName
			externalID
			familyName
			givenName
			id
			identityHolderID
			integrationID
			integrationRunID
			jobTitle
			lastSeenIP
			managedBy
			metadata
			mfaState
			observedAt
			organizationUnit
			ownerID
			phoneNumber
			platformID
			primarySource
			profile
			rawProfileFileID
			removedAt
			scopeID
			scopeName
			secondaryKey
			sourceDefinitionID
			sourceDefinitionVersion
			sourceInstanceID
			sourceVersion
			status
			tags
			updatedAt
			updatedBy
			updatedByImpersonator
		}
	}
}
