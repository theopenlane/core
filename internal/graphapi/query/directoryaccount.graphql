query GetDirectoryAccounts ($first: Int, $last: Int, $where: DirectoryAccountWhereInput) {
	directoryAccounts(first: $first, last: $last, where: $where) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				accountType
				canonicalEmail
				createdAt
				createdBy
				department
				displayID
				displayName
				externalID
				familyName
