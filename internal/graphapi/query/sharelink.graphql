mutation CreateShareLink ($input: CreateShareLinkInput!) {
	createShareLink(input: $input) {
		shareLink {
			createdAt
			createdBy
			expiresAt
			id
			landingPage
			maxUses
			name
			ownerID
			recipientEmails
			requireSession
			revokedAt
			updatedAt
			updatedBy
			updatedByImpersonator
			useCount
			files {
				totalCount
				edges {
					node {
						id
					}
				}
			}
		}
	}
}
mutation DeleteShareLink ($deleteShareLinkId: ID!) {
	deleteShareLink(id: $deleteShareLinkId) {
		deletedID
	}
}
query GetAllShareLinks ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [ShareLinkOrder!]) {
	shareLinks(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				createdAt
				createdBy
				expiresAt
				id
				landingPage
				maxUses
				name
				ownerID
				recipientEmails
				requireSession
				revokedAt
				updatedAt
				updatedBy
				updatedByImpersonator
				useCount
			}
		}
	}
}
query GetShareLinkByID ($shareLinkId: ID!) {
	shareLink(id: $shareLinkId) {
		createdAt
		createdBy
		expiresAt
		id
		landingPage
		maxUses
		name
		ownerID
		recipientEmails
		requireSession
		revokedAt
		updatedAt
		updatedBy
		updatedByImpersonator
		useCount
		files {
			totalCount
			edges {
				node {
					id
				}
			}
		}
		shareLinkAccessEvents {
			totalCount
			edges {
				node {
					id
					createdAt
					fileID
					ipAddress
					userAgent
				}
			}
		}
	}
}
query GetShareLinks ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [ShareLinkOrder!], $where: ShareLinkWhereInput) {
	shareLinks(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy, where: $where) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				createdAt
				createdBy
				expiresAt
				id
				landingPage
				maxUses
				name
				ownerID
				recipientEmails
				requireSession
				revokedAt
				updatedAt
				updatedBy
				updatedByImpersonator
				useCount
			}
		}
	}
}
mutation UpdateShareLink ($updateShareLinkId: ID!, $input: UpdateShareLinkInput!) {
	updateShareLink(id: $updateShareLinkId, input: $input) {
		shareLink {
			createdAt
			createdBy
			expiresAt
			id
			landingPage
			maxUses
			name
			ownerID
			recipientEmails
			requireSession
			revokedAt
			updatedAt
			updatedBy
			updatedByImpersonator
			useCount
		}
	}
}
