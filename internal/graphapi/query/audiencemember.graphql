query GetAllAudienceMembers($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [AudienceMemberOrder!]){
  audienceMembers(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        audienceID
        contactID
        createdAt
        createdBy
        displayID
        email
        fullName
        groupID
        id
        identityHolderID
        metadata
        ownerID
        subscriberID
        updatedAt
        updatedBy
        updatedByImpersonator
        userID
      }
    }
  }
}
