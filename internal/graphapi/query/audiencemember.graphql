query GetAudienceMembers($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [AudienceMemberOrder!], $where: AudienceMemberWhereInput) {
  audienceMembers(
      first: $first
      last: $last
      after: $after
      before: $before
      orderBy: $orderBy
      where: $where
    ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        audienceID
        contactID
        createdAt
        createdBy
        displayID
        email
        fullName
        groupID
        id
        identityHolderID
        metadata
        ownerID
        subscriberID
        updatedAt
        updatedBy
        updatedByImpersonator
        userID
      }
    }
  }
}
