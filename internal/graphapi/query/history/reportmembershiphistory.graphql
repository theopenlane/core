query GetAllReportMembershipHistories ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [ReportMembershipHistoryOrder!]) {
	reportMembershipHistories(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				createdAt
				createdBy
				historyTime
				id
				operation
				ref
				reportID
				role
				updatedAt
				updatedBy
				updatedByImpersonator
				userID
			}
		}
	}
}
query GetReportMembershipHistories ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [ReportMembershipHistoryOrder!], $where: ReportMembershipHistoryWhereInput) {
	reportMembershipHistories(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy, where: $where) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				createdAt
				createdBy
				historyTime
				id
				operation
				ref
				reportID
				role
				updatedAt
				updatedBy
				updatedByImpersonator
				userID
			}
		}
	}
}
