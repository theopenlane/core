query GetAllTrustCenterNDARequestSettingHistories ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [TrustCenterNDARequestSettingHistoryOrder!]) {
	trustCenterNDARequestSettingHistories(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				approvalRequired
				approveFromExistingDomain
				approveIfContactExists
				approverGroupID
				autoApprove
				createdAt
				createdBy
				historyTime
				id
				operation
				ref
				updatedAt
				updatedBy
				updatedByImpersonator
				useDomainAllowlist
				useDomainBlocklist
				workEmailOnly
			}
		}
	}
}
