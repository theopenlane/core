

query GetAllAudienceHistories($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [AudienceHistoryOrder!]){
  audienceHistories(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        audienceType
        createdAt
        createdBy
        description
        displayID
        filters
        historyTime
        id
        name
        operation
        ownerID
        ref
        tags
        updatedAt
        updatedBy
        updatedByImpersonator
      }
    }
  }
}

query GetAudienceHistories($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [AudienceHistoryOrder!], $where: AudienceHistoryWhereInput) {
  audienceHistories(
      first: $first
      last: $last
      after: $after
      before: $before
      orderBy: $orderBy
      where: $where
    ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        audienceType
        createdAt
        createdBy
        description
        displayID
        filters
        historyTime
        id
        name
        operation
        ownerID
        ref
        tags
        updatedAt
        updatedBy
        updatedByImpersonator
      }
    }
  }
}
