query GetAllVendorRiskScoreHistories ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [VendorRiskScoreHistoryOrder!]) {
	vendorRiskScoreHistories(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				answer
				answerType
				assessmentResponseID
				createdAt
				createdBy
				entityID
				externalID
				historyTime
				id
				impact
				integrationRunID
				likelihood
				managedBy
				notes
				operation
				ownerID
				questionCategory
				questionDescription
				questionKey
				questionName
				ref
				score
				sourceDefinitionID
				sourceDefinitionVersion
				sourceInstanceID
				sourceKey
				tags
				updatedAt
				updatedBy
				updatedByImpersonator
				vendorScoringConfigID
			}
		}
	}
}
