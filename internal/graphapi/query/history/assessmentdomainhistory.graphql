query GetAllAssessmentDomainHistories ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [AssessmentDomainHistoryOrder!]) {
	assessmentDomainHistories(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				createdAt
				createdBy
				customDomainID
				historyTime
				id
				operation
				ownerID
				ref
				updatedAt
				updatedBy
				updatedByImpersonator
			}
		}
	}
}
query GetAssessmentDomainHistories ($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [AssessmentDomainHistoryOrder!], $where: AssessmentDomainHistoryWhereInput) {
	assessmentDomainHistories(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy, where: $where) {
		totalCount
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		edges {
			node {
				createdAt
				createdBy
				customDomainID
				historyTime
				id
				operation
				ownerID
				ref
				updatedAt
				updatedBy
				updatedByImpersonator
			}
		}
	}
}
