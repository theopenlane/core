# local disk bucket for the objectstore runtime integration, merge into config/config.yaml
# the scheduled system import reads import.prefix, which has no directory here, so it imports nothing
# demo datasets live under demo/<dataset> and are only read by the demo seed operation
# the committed bucket only holds the small "minimal" dataset, to seed a full dataset put it under
# examples/runtime/demo/<dataset> (gitignored) and point the bucket at ./internal/integrations/definitions/objectstore/examples/runtime
integrations:
  objectstoreruntime:
    import:
      moveprocessed: false
      prefix: system
    providers:
      disk:
        enabled: true
        bucket: ./internal/graphapi/testharness/testdata/objectstore
